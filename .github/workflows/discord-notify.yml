name: Reusable Discord GitHub activity

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send activity to Discord
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            if (!process.env.DISCORD_WEBHOOK_URL) {
              core.setFailed('DISCORD_WEBHOOK_URL is not available to this repository.');
              return;
            }
            const p = context.payload;
            const event = context.eventName;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const actor = p.sender?.login || '알 수 없음';
            const link = p.compare || p.repository?.html_url || `https://github.com/${repo}`;
            let title = `[GitHub] ${repo} · ${event}`;
            let details = '';

            if (event === 'push') {
              const branch = (p.ref || '').replace('refs/heads/', '');
              const commits = (p.commits || []).slice(-10).map(c =>
                `• ${c.author?.name || c.author?.username || '알 수 없음'}: ${c.message.split('\n')[0]} ([${c.id.slice(0, 7)}](${c.url}))`
              );
              const extra = Math.max(0, (p.commits || []).length - commits.length);
              title = `[GitHub] ${repo} · ${branch}에 push`;
              details = commits.join('\n') + (extra ? `\n• 외 ${extra}개 커밋` : '');
            } else if (event === 'pull_request' || event === 'pull_request_review' || event === 'pull_request_review_comment') {
              const pr = p.pull_request;
              title = `[GitHub] PR #${pr?.number || p.number || ''} · ${p.action || event}`;
              details = `${pr?.user?.login || actor}: ${pr?.title || ''}\n${pr?.html_url || link}`;
            } else if (event === 'issues' || event === 'issue_comment') {
              const issue = p.issue;
              title = `[GitHub] Issue #${issue?.number || ''} · ${p.action || event}`;
              details = `${issue?.user?.login || actor}: ${issue?.title || ''}\n${issue?.html_url || link}`;
            } else if (event === 'discussion' || event === 'discussion_comment') {
              const discussion = p.discussion;
              title = `[GitHub] Discussion #${discussion?.number || ''} · ${p.action || event}`;
              details = `${discussion?.user?.login || actor}: ${discussion?.title || ''}\n${discussion?.html_url || link}`;
            } else if (event === 'create' || event === 'delete') {
              title = `[GitHub] ${event}: ${p.ref_type || 'ref'} ${p.ref || ''}`;
              details = `${actor} · ${repo}`;
            } else if (event === 'release') {
              title = `[GitHub] Release ${p.action || ''}: ${p.release?.tag_name || ''}`;
              details = `${p.release?.name || ''}\n${p.release?.html_url || link}`;
            } else if (event === 'workflow_dispatch') {
              title = `[GitHub] ${repo} · 알림 연결 테스트`;
              details = `공통 workflow 수동 수신 테스트\nhttps://github.com/${repo}/actions/runs/${context.runId}`;
            } else {
              details = `${actor} · ${link}`;
            }

            const content = `${title}\n${details}\n작업자: ${actor}`.slice(0, 1900);
            try {
              const target = new URL(process.env.DISCORD_WEBHOOK_URL);
              if (target.protocol !== 'https:' || target.hostname !== 'discord.com' ||
                  !/^\/api\/webhooks\/\d+\/[^/]+$/.test(target.pathname)) {
                core.setFailed('Invalid Discord webhook configuration.');
                return;
              }
              target.searchParams.set('wait', 'true');
              const response = await fetch(target, {
                method: 'POST',
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
                headers: {'content-type': 'application/json'},
                body: JSON.stringify({content, allowed_mentions: {parse: []}})
              });
              if (!response.ok) {
                core.setFailed(`Discord webhook failed: HTTP ${response.status}`);
                return;
              }
              const message = await response.json();
              core.info(`Discord accepted message ${message.id} in channel ${message.channel_id}`);
            } catch {
              core.setFailed('Discord request failed (network, timeout, or invalid response).');
            }
